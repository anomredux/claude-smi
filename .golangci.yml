version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec
    - misspell
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anomredux/claude-smi
